<div class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto bg-surface-container-lowest/95 backdrop-blur-md border-t border-[#E5EBE7] px-6 pt-4 pb-8 flex items-center justify-between z-40">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-primary font-bold" id="selection-counter">3 of 5 selected</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tap to adjust anytime</span>
</div>
<button class="bg-primary hover:bg-[#185849] active:scale-[0.98] text-on-primary px-6 py-3.5 rounded-[14px] font-label-lg text-label-lg font-semibold shadow-sm transition-all flex items-center gap-2" id="continue-btn" type="button">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

<script>
  (function() {
    const chips = document.querySelectorAll('.interest-chip');
    const counter = document.getElementById('selection-counter');
    const continueBtn = document.getElementById('continue-btn');

    function updateState() {
      const selected = document.querySelectorAll('.interest-chip[data-selected="true"]');
      const count = selected.length;
      if (counter) {
        counter.textContent = `${count} of 5 selected`;
      }
      if (continueBtn) {
        if (count >= 3 && count <= 5) {
          continueBtn.disabled = false;
          continueBtn.classList.remove('opacity-40', 'pointer-events-none');
        } else {
          continueBtn.disabled = true;
          continueBtn.classList.add('opacity-40', 'pointer-events-none');
        }
      }
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('data-selected') === 'true';
        const selectedCount = document.querySelectorAll('.interest-chip[data-selected="true"]').length;

        if (!isSelected && selectedCount >= 5) {
          return;
        }

        const nextSelected = !isSelected;
        chip.setAttribute('data-selected', String(nextSelected));

        const icon = chip.querySelector('.material-symbols-outlined');

        if (nextSelected) {
          chip.className = 'interest-chip h-11 px-4 rounded-full inline-flex items-center gap-2 text-sm transition-all bg-[#F0F7F4] border-2 border-primary text-primary font-semibold shadow-sm';
          if (icon) {
            icon.className = 'material-symbols-outlined text-[20px] text-primary';
          }
        } else {
          chip.className = 'interest-chip h-11 px-4 rounded-full inline-flex items-center gap-2 text-sm transition-all bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-normal hover:bg-surface-container-low';
          if (icon) {
            icon.className = 'material-symbols-outlined text-[20px] text-outline';
          }
        }
        updateState();
      });
    });

    const addBtn = document.getElementById('add-custom-btn');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const currentSelected = document.querySelectorAll('.interest-chip[data-selected="true"]').length;
        if (currentSelected >= 5) return;
        const customName = prompt("Add a new interest:");
        if (customName && customName.trim()) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('data-selected', 'true');
          btn.className = 'interest-chip h-11 px-4 rounded-full inline-flex items-center gap-2 text-sm transition-all bg-[#F0F7F4] border-2 border-primary text-primary font-semibold shadow-sm';
          btn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-primary">tag</span><span>${customName.trim()}</span>`;
          btn.addEventListener('click', () => {
            const isSel = btn.getAttribute('data-selected') === 'true';
            btn.setAttribute('data-selected', String(!isSel));
            const ic = btn.querySelector('.material-symbols-outlined');
            if (!isSel) {
              btn.className = 'interest-chip h-11 px-4 rounded-full inline-flex items-center gap-2 text-sm transition-all bg-[#F0F7F4] border-2 border-primary text-primary font-semibold shadow-sm';
              if (ic) ic.className = 'material-symbols-outlined text-[20px] text-primary';
            } else {
              btn.className = 'interest-chip h-11 px-4 rounded-full inline-flex items-center gap-2 text-sm transition-all bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-normal hover:bg-surface-container-low';
              if (ic) ic.className = 'material-symbols-outlined text-[20px] text-outline';
            }
            updateState();
          });
          addBtn.parentNode.insertBefore(btn, addBtn);
          updateState();
        }
      });
    }

    updateState();
  })();
</script></main>
