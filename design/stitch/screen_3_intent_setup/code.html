<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Sora:wght@100..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-container": "#d4e6e0", "error": "#ba1a1a", "surface-container-high": "#e6e9e7", "surface-variant": "#e0e3e1", "on-error-container": "#93000a", "outline": "#6f7975", "on-surface": "#181c1b", "secondary": "#51625d", "on-tertiary-fixed-variant": "#304c45", "surface-container-low": "#f1f4f2", "primary": "#005645", "surface": "#f7faf8", "tertiary-fixed": "#cae9e0", "inverse-on-surface": "#eef1ef", "primary-fixed": "#a5f2d9", "on-tertiary": "#ffffff", "on-primary-fixed": "#002019", "on-tertiary-container": "#c8e7de", "tertiary": "#35514a", "on-primary": "#ffffff", "secondary-fixed": "#d4e6e0", "outline-variant": "#bec9c4", "surface-container": "#ebefed", "on-primary-container": "#a3efd7", "on-primary-fixed-variant": "#005141", "surface-bright": "#f7faf8", "on-secondary": "#ffffff", "on-error": "#ffffff", "tertiary-container": "#4d6961", "primary-container": "#1f6f5c", "on-secondary-fixed-variant": "#3a4a46", "on-secondary-fixed": "#0f1e1b", "surface-dim": "#d7dbd9", "error-container": "#ffdad6", "on-background": "#181c1b", "surface-container-highest": "#e0e3e1", "tertiary-fixed-dim": "#aecdc4", "on-tertiary-fixed": "#03201a", "background": "#f7faf8", "inverse-surface": "#2d3130", "inverse-primary": "#8ad5be", "surface-tint": "#186a57", "on-surface-variant": "#3f4945", "surface-container-lowest": "#ffffff", "on-secondary-container": "#576863", "primary-fixed-dim": "#8ad5be", "secondary-fixed-dim": "#b9cac5" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1.25rem", "space-sm": "0.5rem", "space-md": "1rem" }, "fontFamily": { "body-md": ["DM Sans"], "body-sm": ["DM Sans"], "label-sm": ["DM Sans"], "headline-md": ["Sora"], "label-lg": ["DM Sans"], "headline-sm": ["Sora"], "label-md": ["DM Sans"], "headline-lg": ["Sora"], "body-lg": ["DM Sans"], "headline-xl": ["Sora"] }, "fontSize": { "body-md": ["15px", {"lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400"}], "body-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500"}], "headline-md": ["20px", {"lineHeight": "26px", "letterSpacing": "-0.02em", "fontWeight": "600"}], "label-lg": ["15px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600"}], "label-md": ["13px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}], "headline-lg": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.025em", "fontWeight": "700"}], "body-lg": ["17px", {"lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "400"}], "headline-xl": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "700"}] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Dimmed & Soft-Blurred Home Backdrop Simulation -->
<div aria-hidden="true" class="w-full px-5 pt-3 pb-8 opacity-40 blur-[2px] pointer-events-none flex flex-col gap-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-primary font-headline-sm text-headline-sm">
          S
        </div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-secondary">TODAY'S INTENTION</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Digital Clarity</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">notifications_none</span>
</div>
</div>
<!-- Backdrop Content Cards -->
<div class="w-full rounded-[20px] bg-surface-container-lowest p-5 flex flex-col gap-4 shadow-sm">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-secondary">Active Intentions</span>
<span class="font-label-sm text-label-sm text-primary font-semibold">2 ready</span>
</div>
<div class="h-28 rounded-xl bg-surface-container-low w-full"></div>
<div class="h-10 rounded-full bg-surface-container-high w-1/2"></div>
</div>
<div class="w-full rounded-[20px] bg-surface-container-lowest p-5 flex flex-col gap-3 shadow-sm">
<div class="h-5 bg-surface-container-low rounded w-1/3"></div>
<div class="h-16 bg-surface-container-low rounded-xl w-full"></div>
</div>
</div>
<!-- Modal Tint Scrim -->
<div class="absolute inset-0 bg-on-tertiary-fixed-variant/45 backdrop-blur-[3px] transition-opacity duration-300"></div>
<!-- Bottom Sheet Container -->
<div class="relative z-10 w-full mt-auto bg-surface-container-lowest rounded-t-[24px] shadow-2xl flex flex-col pt-3 pb-6 px-5 transition-transform duration-300 ease-out">
<!-- Top Center Drag Handle -->
<div class="w-full flex items-center justify-center pt-1 pb-3">
<div class="w-[36px] h-[4px] rounded-full bg-outline-variant"></div>
</div>
<!-- Header Row -->
<div class="flex items-center justify-between pb-5">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-11 h-11 rounded-[14px] bg-secondary-container flex items-center justify-center text-primary-container shrink-0">
<span class="material-symbols-outlined text-[24px]">movie</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm tracking-wider uppercase text-secondary">Exploring</span>
<h2 class="font-headline-md text-headline-md text-on-surface truncate">Filmmaking</h2>
</div>
</div>
<button aria-label="Close setup modal" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-secondary hover:text-on-surface active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Modal Form Body -->
<div class="flex flex-col gap-5">
<!-- 1. Duration Selection -->
<div class="flex flex-col gap-2.5">
<label class="font-label-lg text-label-lg text-on-surface">How long do you want?</label>
<div class="grid grid-cols-4 gap-2 w-full" id="duration-pills">
<!-- 5 min -->
<button class="duration-option h-[44px] rounded-xl bg-surface-container-low text-on-surface font-label-md text-label-md flex items-center justify-center transition-all duration-150 active:scale-95" type="button">
            5 min
          </button>
<!-- 10 min (Selected) -->
<button class="duration-option active-duration h-[44px] rounded-xl bg-secondary-container text-primary-container font-label-lg text-label-lg font-semibold flex items-center justify-center shadow-sm transition-all duration-150" type="button">
            10 min
          </button>
<!-- 15 min -->
<button class="duration-option h-[44px] rounded-xl bg-surface-container-low text-on-surface font-label-md text-label-md flex items-center justify-center transition-all duration-150 active:scale-95" type="button">
            15 min
          </button>
<!-- Custom -->
<button class="duration-option h-[44px] rounded-xl bg-surface-container text-secondary font-label-md text-label-md flex items-center justify-center transition-all duration-150 active:scale-95" type="button">
            Custom
          </button>
</div>
</div>
<!-- 2. Goal Input Field -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="intent-focus">
          What do you want to find? <span class="font-body-sm text-body-sm text-secondary font-normal">(optional)</span>
</label>
<div class="relative w-full">
<input class="w-full h-[52px] px-4 rounded-[14px] bg-surface-container-low font-body-md text-body-md text-on-surface placeholder:text-secondary/60 focus:bg-surface-container-lowest focus:outline-none transition-all duration-150" id="intent-focus" placeholder="e.g. Save 2 framing ideas" type="text" value="Find 3 color grading references"/>
<button aria-label="Clear field" class="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-surface-variant flex items-center justify-center text-secondary active:text-on-surface" id="clear-input-btn" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<!-- 3. Pre-scroll Mindful Activity Toggle -->
<div class="w-full rounded-[16px] bg-surface-container-low p-3.5 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-surface-container-highest flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[18px]">self_improvement</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Do a 60-second activity first</span>
<span class="font-body-sm text-body-sm text-secondary">Breathe or align focus before opening</span>
</div>
</div>
<!-- iOS Style Switch Toggle -->
<button aria-checked="false" class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-surface-variant p-0.5 transition-colors duration-200 ease-in-out focus:outline-none" id="toggle-activity" role="switch" type="button">
<span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-container-lowest shadow-md transition duration-200 ease-in-out translate-x-0" id="toggle-indicator"></span>
</button>
</div>
<!-- 4. Action Button & Serene Footer -->
<div class="flex flex-col items-center gap-2.5 pt-2">
<button class="w-full h-[56px] rounded-full bg-primary-container hover:bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-sm transition-all duration-200 active:scale-[0.99]" type="button">
<span>Enter Instagram</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-sm text-body-sm text-secondary text-center flex items-center gap-1.5 pt-0.5">
<span class="material-symbols-outlined text-[15px] text-secondary">timer</span>
          We'll nudge you when your time is up
        </p>
</div>
</div>
</div>
<script>
    (function () {
      // Toggle interaction
      const toggle = document.getElementById('toggle-activity');
      const knob = document.getElementById('toggle-indicator');
      if (toggle && knob) {
        toggle.addEventListener('click', () => {
          const isChecked = toggle.getAttribute('aria-checked') === 'true';
          const nextState = !isChecked;
          toggle.setAttribute('aria-checked', String(nextState));
          if (nextState) {
            toggle.classList.remove('bg-surface-variant');
            toggle.classList.add('bg-primary-container');
            knob.classList.add('translate-x-5');
          } else {
            toggle.classList.remove('bg-primary-container');
            toggle.classList.add('bg-surface-variant');
            knob.classList.remove('translate-x-5');
          }
        });
      }

      // Duration pills selector
      const durationButtons = document.querySelectorAll('.duration-option');
      durationButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          durationButtons.forEach((b) => {
            b.classList.remove(
              'active-duration',
              'bg-secondary-container',
              'text-primary-container',
              'font-semibold',
              'shadow-sm'
            );
            b.classList.add('bg-surface-container-low', 'text-on-surface');
          });
          btn.classList.remove('bg-surface-container-low', 'text-on-surface');
          btn.classList.add(
            'active-duration',
            'bg-secondary-container',
            'text-primary-container',
            'font-semibold',
            'shadow-sm'
          );
        });
      });

      // Clear input field button
      const clearBtn = document.getElementById('clear-input-btn');
      const inputField = document.getElementById('intent-focus');
      if (clearBtn && inputField) {
        clearBtn.addEventListener('click', () => {
          inputField.value = '';
          inputField.focus();
        });
      }
    })();
  </script>
</div></main></body></html>
