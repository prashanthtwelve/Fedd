  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-6 py-6 selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Top Branding -->
<header class="flex items-center justify-between pt-2 pb-8">
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
<span class="font-headline-sm text-headline-sm text-primary-container tracking-tight">FedD</span>
</div>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container px-2.5 py-1 rounded-full">Focused Session</span>
</header>
<!-- Header Block -->
<div class="space-y-2 mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary">Log in to start your next intentional session.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col space-y-5" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="emailInput">Email</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm transition-all focus-within:shadow-md">
<input autocomplete="email" class="w-full bg-transparent px-4 py-3.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-xl" id="emailInput" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="passwordInput">Password</label>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm transition-all focus-within:shadow-md">
<input autocomplete="current-password" class="w-full bg-transparent pl-4 pr-11 py-3.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-xl tracking-wider" id="passwordInput" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 text-secondary hover:text-primary-container transition-colors focus:outline-none rounded-lg" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-lg leading-none select-none" id="passwordEyeIcon">visibility_off</span>
</button>
</div>
<div class="flex justify-end pt-1">
<button class="font-label-md text-label-md text-secondary hover:text-primary-container transition-colors py-0.5" type="button">
          Forgot password?
        </button>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-2">
<button class="w-full py-4 rounded-full bg-primary-container text-on-primary font-headline-sm text-label-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span class="">Log in</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Mindful Divider -->
<div class="relative my-7 flex items-center justify-center">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute bg-surface px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">or</span>
</div>
<!-- Social Logins -->
<div class="flex flex-col space-y-3">
<!-- Google -->
<button class="w-full py-3.5 px-4 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-3 shadow-sm hover:bg-surface-container-low active:scale-[0.99] transition-all" type="button">
<svg aria-hidden="true" class="w-4 h-4" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<!-- Apple -->
<button class="w-full py-3.5 px-4 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-3 shadow-sm hover:bg-surface-container-low active:scale-[0.99] transition-all" type="button">
<svg aria-hidden="true" class="w-4 h-4 text-on-surface fill-current" viewBox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.43-6.19-9.46-11.08-20.19-14.67-32.18-3.59-12-5.39-23.47-5.39-34.41 0-14.35 3.69-26.31 11.08-35.88 7.39-9.57 16.63-14.47 27.72-14.7 4.9 0 10.11 1.25 15.63 3.75 5.51 2.5 9.38 3.79 11.6 3.86 1.74 0 5.76-1.39 12.07-4.17 6.31-2.77 11.85-3.99 16.63-3.65 12.61.65 22.84 5.37 30.68 14.17-10.99 6.64-16.38 15.82-16.16 27.53.22 9.14 3.79 16.97 10.7 23.5 6.91 6.53 15.11 10.22 24.6 11.09-2.07 6.09-4.57 12.28-7.51 18.57zM119.22 31.84c0-7.39 2.66-14.4 7.99-21.03 5.33-6.63 11.8-10.81 19.41-12.54.87 7.07-1.47 13.97-7.01 20.69-5.54 6.72-12.33 10.85-20.39 12.88z"></path>
</svg>
<span class="">Continue with Apple</span>
</button>
</div>
<!-- Intention Reminder Pebble -->
<div class="mt-8 mb-6 p-4 rounded-2xl bg-surface-container-low flex items-start gap-3">
<span class="material-symbols-outlined text-primary-container text-base mt-0.5">spa</span>
<p class="font-body-sm text-body-sm text-secondary">
      Fedd gives you deliberate pauses and conscious feeds. No algorithmic spiral—just what you choose.
    </p>
</div>
<!-- Bottom Navigation / Switch Link -->
<footer class="mt-auto pt-4 pb-2 text-center">
<p class="font-body-md text-body-md text-secondary">
      New to Fedd? 
      <button class="font-label-lg text-label-lg text-primary-container hover:underline ml-1 focus:outline-none" type="button">
        Create account
      </button>
</p>
</footer>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
</script></main>


</body></html>
