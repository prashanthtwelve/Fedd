<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Sora:wght@100..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-container": "#d4e6e0", "error": "#ba1a1a", "surface-container-high": "#e6e9e7", "surface-variant": "#e0e3e1", "on-error-container": "#93000a", "outline": "#6f7975", "on-surface": "#181c1b", "secondary": "#51625d", "on-tertiary-fixed-variant": "#304c45", "surface-container-low": "#f1f4f2", "primary": "#005645", "surface": "#f7faf8", "tertiary-fixed": "#cae9e0", "inverse-on-surface": "#eef1ef", "primary-fixed": "#a5f2d9", "on-tertiary": "#ffffff", "on-primary-fixed": "#002019", "on-tertiary-container": "#c8e7de", "tertiary": "#35514a", "on-primary": "#ffffff", "secondary-fixed": "#d4e6e0", "outline-variant": "#bec9c4", "surface-container": "#ebefed", "on-primary-container": "#a3efd7", "on-primary-fixed-variant": "#005141", "surface-bright": "#f7faf8", "on-secondary": "#ffffff", "on-error": "#ffffff", "tertiary-container": "#4d6961", "primary-container": "#1f6f5c", "on-secondary-fixed-variant": "#3a4a46", "on-secondary-fixed": "#0f1e1b", "surface-dim": "#d7dbd9", "error-container": "#ffdad6", "on-background": "#181c1b", "surface-container-highest": "#e0e3e1", "tertiary-fixed-dim": "#aecdc4", "on-tertiary-fixed": "#03201a", "background": "#f7faf8", "inverse-surface": "#2d3130", "inverse-primary": "#8ad5be", "surface-tint": "#186a57", "on-surface-variant": "#3f4945", "surface-container-lowest": "#ffffff", "on-secondary-container": "#576863", "primary-fixed-dim": "#8ad5be", "secondary-fixed-dim": "#b9cac5" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1.25rem", "space-sm": "0.5rem", "space-md": "1rem" }, "fontFamily": { "body-md": ["DM Sans"], "body-sm": ["DM Sans"], "label-sm": ["DM Sans"], "headline-md": ["Sora"], "label-lg": ["DM Sans"], "headline-sm": ["Sora"], "label-md": ["DM Sans"], "headline-lg": ["Sora"], "body-lg": ["DM Sans"], "headline-xl": ["Sora"] }, "fontSize": { "body-md": ["15px", {"lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400"}], "body-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500"}], "headline-md": ["20px", {"lineHeight": "26px", "letterSpacing": "-0.02em", "fontWeight": "600"}], "label-lg": ["15px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.015em", "fontWeight": "600"}], "label-md": ["13px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}], "headline-lg": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.025em", "fontWeight": "700"}], "body-lg": ["17px", {"lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "400"}], "headline-xl": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "700"}] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg">
<!-- Lock-screen / App Push Notification Preview Banner -->
<aside aria-label="System notification prompt" class="mt-space-xs mb-space-md w-full rounded-2xl bg-surface-container-lowest/95 backdrop-blur-md p-3.5 shadow-sm flex items-center gap-3 transition-transform duration-300 active:scale-[0.99]">
<div class="w-8 h-8 rounded-xl bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center gap-1.5">
<span class="font-label-sm text-label-sm text-secondary">FedD</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-label-sm text-label-sm text-secondary">FedD</span>
</div>
<p class="font-label-lg text-label-lg text-on-surface truncate">Your 10 minutes are up. Ready to check in?</p>
</div>
<span class="material-symbols-outlined text-secondary text-[18px] shrink-0">chevron_right</span>
</aside>
<!-- Contextual Pill Badge -->
<div class="flex items-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 bg-secondary-container text-primary-container rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-label-md text-label-md">Filmmaking · 10 minutes done</span>
</div>
</div>
<!-- Heading Block -->
<div class="mt-2 mb-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Did you find what you wanted?</h1>
<p class="font-body-md text-body-md text-secondary mt-1">Your goal: find 3 color grading references</p>
</div>
<!-- Interactive Decision Cards Stack -->
<fieldset aria-label="Session outcome" class="flex flex-col gap-3 mb-space-lg" id="intention-options" role="radiogroup">
<!-- Card 1: Selected state -->
<label class="choice-card cursor-pointer rounded-2xl p-4 flex items-center justify-between transition-all duration-200 bg-secondary-container shadow-sm" data-id="found">
<input checked="" class="sr-only" name="session_outcome" type="radio" value="found">
<div class="flex items-center gap-3.5">
<div class="icon-box w-10 h-10 rounded-xl bg-surface-container-lowest flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-[22px]">check_circle</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface font-semibold">Found what I needed</span>
<span class="font-body-sm text-body-sm text-secondary">Ready to step away cleanly</span>
</div>
</div>
<span class="status-indicator material-symbols-outlined text-primary-container text-[20px]">radio_button_checked</span>
</label>
<!-- Card 2: Need more time -->
<label class="choice-card cursor-pointer rounded-2xl p-4 flex items-center justify-between transition-all duration-200 bg-surface-container-lowest shadow-sm" data-id="extend">
<input class="sr-only" name="session_outcome" type="radio" value="extend">
<div class="flex items-center gap-3.5">
<div class="icon-box w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[22px]">schedule</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Need 5 more minutes</span>
<span class="font-body-sm text-body-sm text-secondary">A brief, quiet buffer</span>
</div>
</div>
<span class="status-indicator material-symbols-outlined text-outline-variant text-[20px]">radio_button_unchecked</span>
</label>
<!-- Card 3: Got distracted (Dignified, non-punitive acceptance) -->
<label class="choice-card cursor-pointer rounded-2xl p-4 flex items-center justify-between transition-all duration-200 bg-surface-container-lowest shadow-sm" data-id="distracted">
<input class="sr-only" name="session_outcome" type="radio" value="distracted">
<div class="flex items-center gap-3.5">
<div class="icon-box w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[22px]">visibility_off</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Got distracted</span>
<span class="font-body-sm text-body-sm text-secondary">Completely normal. Reset softly</span>
</div>
</div>
<span class="status-indicator material-symbols-outlined text-outline-variant text-[20px]">radio_button_unchecked</span>
</label>
</fieldset>
<!-- Reflection Takeaway Field -->
<div class="flex flex-col mb-space-xl">
<div class="flex items-center justify-between mb-2">
<label class="font-label-md text-label-md text-secondary" for="takeaway-input">
        Save one thing to try <span class="text-secondary/70 font-normal">(optional)</span>
</label>
<span class="font-label-sm text-label-sm text-secondary/70" id="char-count">0/120</span>
</div>
<div class="relative w-full rounded-xl bg-surface-container-lowest shadow-sm">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md placeholder:text-secondary/60 focus:outline-none focus:bg-surface-container-low transition-colors" id="takeaway-input" maxlength="120" placeholder="e.g. teal and orange split toning technique" type="text">
</div>
</div>
<!-- Bottom Primary Action & Graceful Anchoring -->
<div class="flex flex-col items-center mt-auto pt-space-xs">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-md hover:bg-primary" id="submit-checkin" type="button">
<span class="">Done</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-sm text-body-sm text-secondary text-center mt-3 flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary-container">bookmark_added</span>
<span class="">Saved ideas go to your FedD board</span>
</p>
</div>
</div>
<script>
  (function initCheckinInteractions() {
    const cards = document.querySelectorAll('.choice-card');
    const input = document.getElementById('takeaway-input');
    const charCount = document.getElementById('char-count');
    const doneBtn = document.getElementById('submit-checkin');

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.classList.remove('bg-secondary-container');
          c.classList.add('bg-surface-container-lowest');
          const radio = c.querySelector('input[type="radio"]');
          const iconBox = c.querySelector('.icon-box');
          const indicator = c.querySelector('.status-indicator');
          const title = c.querySelector('.font-label-lg');
          if (radio) radio.checked = false;
          if (iconBox) {
            iconBox.classList.remove('bg-surface-container-lowest');
            iconBox.classList.add('bg-surface-container');
            const icon = iconBox.querySelector('.material-symbols-outlined');
            if (icon) {
              icon.classList.remove('text-primary-container');
              icon.classList.add('text-secondary');
            }
          }
          if (indicator) {
            indicator.textContent = 'radio_button_unchecked';
            indicator.classList.remove('text-primary-container');
            indicator.classList.add('text-outline-variant');
          }
          if (title) title.classList.remove('font-semibold');
        });

        card.classList.remove('bg-surface-container-lowest');
        card.classList.add('bg-secondary-container');
        const activeRadio = card.querySelector('input[type="radio"]');
        const activeIconBox = card.querySelector('.icon-box');
        const activeIndicator = card.querySelector('.status-indicator');
        const activeTitle = card.querySelector('.font-label-lg');
        
        if (activeRadio) activeRadio.checked = true;
        if (activeTitle) activeTitle.classList.add('font-semibold');
        if (activeIconBox) {
          activeIconBox.classList.remove('bg-surface-container');
          activeIconBox.classList.add('bg-surface-container-lowest');
          const icon = activeIconBox.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.classList.remove('text-secondary');
            icon.classList.add('text-primary-container');
          }
        }
        if (activeIndicator) {
          activeIndicator.textContent = 'radio_button_checked';
          activeIndicator.classList.remove('text-outline-variant');
          activeIndicator.classList.add('text-primary-container');
        }
      });
    });

    if (input && charCount) {
      input.addEventListener('input', (e) => {
        const length = e.target.value.length;
        charCount.textContent = `${length}/120`;
      });
    }

    if (doneBtn) {
      doneBtn.addEventListener('click', () => {
        doneBtn.classList.add('opacity-85');
        const icon = doneBtn.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = 'check';
        setTimeout(() => {
          doneBtn.classList.remove('opacity-85');
        }, 400);
      });
    }
  })();
</script></main>

</body></html>
